<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Questflow Web Onboarding Demo</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#030605;color:#f4fff8;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.bg{min-height:100vh;background:radial-gradient(circle at 18% 0%,rgba(26,255,168,.14),transparent 34%),radial-gradient(circle at 82% 100%,rgba(26,255,168,.08),transparent 32%);padding:30px}
.shell{max-width:1160px;margin:0 auto;min-height:calc(100vh - 60px);display:grid;grid-template-rows:auto 1fr auto;gap:26px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;gap:10px;align-items:center;font-weight:900}
.mark{width:30px;height:30px;border-radius:10px;background:#24f2a0;box-shadow:0 0 30px rgba(36,242,160,.35)}
.skip,.back,.next{border:0;border-radius:999px;padding:12px 18px;font-weight:900;cursor:pointer}
.skip,.back{background:rgba(255,255,255,.055);color:#a7bab5;border:1px solid rgba(255,255,255,.08)}
.back:disabled{opacity:.35;cursor:not-allowed}
.next{background:#24f2a0;color:#02110a;box-shadow:0 14px 34px rgba(36,242,160,.22)}
.hero{text-align:center;align-self:center}
.page-indicator{display:inline-flex;border:1px solid rgba(36,242,160,.2);background:rgba(36,242,160,.06);color:#24f2a0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:900;margin-bottom:18px}
h1{font-size:56px;line-height:1.02;letter-spacing:-.06em;margin:0}
.subtitle{font-size:20px;line-height:1.45;color:#8fa39e;margin:15px auto 0;max-width:840px}
.preview{margin:34px auto 0;width:min(100%,1040px);min-height:430px;border:1px solid rgba(255,255,255,.09);border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));box-shadow:0 28px 90px rgba(0,0,0,.35);overflow:hidden;text-align:left}
.browser{height:46px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:8px;padding:0 16px;background:rgba(0,0,0,.2)}
.dot{width:10px;height:10px;border-radius:50%;background:#32413d}.dot:nth-child(1){background:#ff5f57}.dot:nth-child(2){background:#febc2e}.dot:nth-child(3){background:#28c840}
.url{height:26px;flex:1;border-radius:999px;background:rgba(255,255,255,.055);display:flex;align-items:center;padding:0 12px;color:#6f827d;font-size:12px;font-weight:800}
.web{height:384px;display:grid;grid-template-columns:210px 1fr 280px}
.side,.right{padding:18px;background:rgba(0,0,0,.15)}
.side{border-right:1px solid rgba(255,255,255,.08)}
.right{border-left:1px solid rgba(255,255,255,.08)}
.nav{height:38px;border-radius:12px;padding:0 12px;display:flex;align-items:center;color:#8fa39e;font-size:13px;font-weight:800;margin-bottom:8px}
.nav.active{background:rgba(36,242,160,.12);color:#24f2a0}
.content{padding:20px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.head b{font-size:20px}
.chip{display:inline-flex;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900;background:rgba(36,242,160,.11);color:#24f2a0}
.chip.blue{background:rgba(77,163,255,.13);color:#4da3ff}.chip.red{background:rgba(255,107,107,.13);color:#ff6b6b}.chip.gold{background:rgba(242,201,76,.15);color:#f2c94c}.chip.gray{background:rgba(255,255,255,.07);color:#a7bab5}
.card{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);border-radius:20px;padding:15px;margin-bottom:12px}
.card-title{font-weight:900;line-height:1.35;margin:10px 0 7px}
.card-text{color:#8fa39e;font-size:13px;line-height:1.5}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}
.metric{border-radius:14px;background:rgba(0,0,0,.18);padding:10px;color:#788d88;font-size:11px}.metric b{display:block;color:#f4fff8;font-size:14px;margin-bottom:4px}
.market{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);border-radius:18px;padding:13px;margin-bottom:10px;font-size:13px;font-weight:900}.market span{display:block;color:#24f2a0;margin-top:8px}
.footer{display:flex;justify-content:space-between;align-items:center}
.dots{display:flex;gap:9px}.stepdot{width:9px;height:9px;border-radius:999px;background:#263633}.stepdot.active{width:32px;background:#24f2a0}
.actions{display:flex;gap:10px}
.focus{padding:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-height:430px}
.focus-card{position:relative;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);border-radius:24px;padding:20px;cursor:pointer;color:#f4fff8;text-align:left}
.focus-card.active{border-color:rgba(36,242,160,.72);background:rgba(36,242,160,.095)}
.check{position:absolute;right:16px;top:16px;width:24px;height:24px;border-radius:50%;border:1px solid rgba(255,255,255,.16);display:grid;place-items:center;color:transparent;font-size:12px}
.active .check{background:#24f2a0;color:#02110a;border-color:#24f2a0}
.icon{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.07);display:grid;place-items:center;margin-bottom:14px}
.focus-card b{display:block;font-size:16px;margin-bottom:7px}.focus-card p{margin:0;color:#8fa39e;font-size:12px;line-height:1.45}
.event{height:384px;display:grid;grid-template-columns:1fr 1.25fr 1fr}.event>div{padding:22px;border-right:1px solid rgba(255,255,255,.08)}.event>div:last-child{border-right:0;background:rgba(0,0,0,.13)}
.big{border:1px solid rgba(36,242,160,.28);background:rgba(36,242,160,.075);border-radius:24px;padding:20px;margin-top:14px}.big h3{font-size:22px;margin:0 0 18px;line-height:1.2}
.odds{display:grid;grid-template-columns:1fr 1fr;gap:10px}.odd{border-radius:16px;background:rgba(0,0,0,.2);padding:14px;color:#8fa39e}.odd b{display:block;color:#24f2a0;font-size:26px}
.ai{height:384px;display:grid;grid-template-columns:320px 1fr}.ctx{padding:22px;border-right:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.13)}.chat{padding:22px}
.shortcuts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}.shortcut{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);border-radius:16px;padding:12px;font-size:12px;font-weight:850}
.bubble{max-width:76%;border-radius:18px;padding:13px 14px;font-size:13px;line-height:1.45;background:rgba(255,255,255,.06);color:#c7d8d3;margin-bottom:10px}.bubble.me{margin-left:auto;background:rgba(36,242,160,.12);border:1px solid rgba(36,242,160,.18)}
.input{height:46px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.18);border-radius:18px;margin-top:16px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#6f827d;font-size:13px}.voice{color:#24f2a0;font-weight:900}
.plans{padding:34px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;min-height:430px}.plan{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.045);border-radius:26px;padding:24px;display:flex;flex-direction:column}.plan.pro{border-color:rgba(77,163,255,.55)}.plan.max{border-color:rgba(242,201,76,.5)}
.plan-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.plan h3{margin:0;font-size:20px}.price{font-size:36px;font-weight:950;letter-spacing:-.04em;margin-bottom:12px}.price small{font-size:13px;color:#8fa39e}.plan p{margin:0;color:#8fa39e;font-size:13px;line-height:1.52;flex:1}.plan-btn{margin-top:20px;border:0;border-radius:999px;padding:13px;font-weight:950;background:rgba(255,255,255,.08);color:#f4fff8}.pro .plan-btn{background:#4da3ff;color:#06111e}.max .plan-btn{background:#f2c94c;color:#181000}
@media(max-width:900px){.bg{padding:18px}h1{font-size:38px}.subtitle{font-size:16px}.web,.event,.ai{grid-template-columns:1fr;height:auto}.side,.right,.event>div,.ctx{border:0;border-bottom:1px solid rgba(255,255,255,.08)}.focus,.plans{grid-template-columns:1fr;padding:18px}.preview{min-height:auto}}
</style>
</head>
<body>
<div class="bg">
  <div class="shell">
    <div class="top">
      <div class="logo"><span class="mark"></span>Questflow</div>
      <button class="skip" onclick="finish()">Skip</button>
    </div>
    <main class="hero">
      <div class="page-indicator" id="indicator">Page 1 / 5</div>
      <h1 id="title"></h1>
      <p class="subtitle" id="subtitle"></p>
      <div class="preview" id="preview"></div>
    </main>
    <div class="footer">
      <div class="dots" id="dots"></div>
      <div class="actions">
        <button class="back" id="backBtn" onclick="prev()">Back</button>
        <button class="next" id="nextBtn" onclick="next()">Continue</button>
      </div>
    </div>
  </div>
</div>
<script>
const pages=[
{t:'Signals at a glance',s:'Turn market news into clear, readable signals.',r:signals},
{t:'Trade across markets',s:'Trade prediction markets on Polymarket and perpetuals on Hyperliquid.',r:trading},
{t:'Pick your focus',s:'Choose the topics and markets you want to follow.',r:focus},
{t:'Ask AI Broker',s:'Use shortcuts, text, or voice to explore signals and trading opportunities.',r:ai},
{t:'Choose your plan',s:'Free / Pro / Max define AI Broker access. Try Pro / Max free for 3 days.',r:plans}
];
let step=0, selected=new Set(['Prediction Markets','Crypto Perps & Spot','Tech & AI']);
function browser(inner){return `<div class="browser"><span class="dot"></span><span class="dot"></span><span class="dot"></span><div class="url">questflow.ai/onboarding-preview</div></div>${inner}`}
function signals(){return browser(`<div class="web"><div class="side"><div class="nav active">Signals</div><div class="nav">Events</div><div class="nav">AI Broker</div><div class="nav">Portfolios</div></div><div class="content"><div class="head"><b>Live Signal Feed</b><span class="chip">Market Moving</span></div><div class="card"><span class="chip">Bullish</span> <span class="chip blue">AI Summary</span> <span class="chip gold">High Impact</span><div class="card-title">New headline triggers movement across related markets</div><div class="card-text">Market news is converted into a readable signal with direction, context, and related markets.</div><div class="metrics"><div class="metric"><b>88/100</b>Signal score</div><div class="metric"><b>Live</b>Status</div><div class="metric"><b>12</b>Markets</div></div></div><div class="card"><span class="chip red">Bearish</span> <span class="chip blue">Related Markets</span><div class="card-title">Latest report shows pressure after market update</div><div class="card-text">Scan what happened, why it matters, and where to go next.</div></div></div><div class="right"><div class="market">Primary event market<span>YES 62%</span></div><div class="market">Crypto perp reaction<span>LONG bias</span></div><div class="market">Equity watchlist<span>3 tickers</span></div></div></div>`)}
function focusCard(n,d,i){let a=selected.has(n)?'active':'';return `<button class="focus-card ${a}" onclick="toggle('${n}')"><span class="check">✓</span><div class="icon">${i}</div><b>${n}</b><p>${d}</p></button>`}
function focus(){return `<div class="focus">${focusCard('Prediction Markets','Politics, crypto, economy, culture, weather, and more.','◎')}${focusCard('Sports','NBA, NFL, soccer, tennis, UFC, esports, and major games.','◈')}${focusCard('Crypto Perps & Spot','BTC, ETH, major alts, meme coins, DeFi tokens, commodities, and equities.','₿')}${focusCard('Economy & Rates','Fed, CPI, GDP, recession, yields, and macro events.','%')}${focusCard('Tech & AI','AI, chips, Big Tech, regulation, and product launches.','✦')}${focusCard('Geopolitics','Wars, sanctions, elections, diplomacy, and global risks.','⌁')}</div>`}
function trading(){return browser(`
<div class="event">
  <div>
    <span class="chip">Trading</span>
    <div class="card">
      <span class="chip gold">Cross-market</span>
      <div class="card-title">Move from a signal directly into the relevant market.</div>
      <div class="card-text">Use one workspace to discover and trade prediction markets and perpetuals.</div>
    </div>
    <div class="market">Polymarket<span>Prediction Markets</span></div>
    <div class="market">Hyperliquid<span>Perpetuals</span></div>
  </div>

  <div>
    <span class="chip blue">Polymarket · PM</span>
    <div class="big">
      <h3>Will the event happen before the deadline?</h3>
      <div class="odds">
        <div class="odd">YES<b>62¢</b></div>
        <div class="odd">NO<b>38¢</b></div>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-title">Trade the outcome</div>
      <div class="card-text">Buy YES or NO based on the probability you expect.</div>
    </div>
  </div>

  <div>
    <span class="chip gold">Hyperliquid · HL</span>
    <div class="big">
      <h3>BTC-PERP</h3>
      <div class="odds">
        <div class="odd">Price<b>$104.8K</b></div>
        <div class="odd">Leverage<b>5×</b></div>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <span class="chip">Long</span> <span class="chip red">Short</span>
      <div class="card-title">Trade perpetual futures</div>
      <div class="card-text">Choose direction, size, leverage, and risk controls.</div>
    </div>
  </div>
</div>`)}
function ai(){return browser(`<div class="ai"><div class="ctx"><span class="chip">Current Context</span><div class="card"><div class="card-title">AI Broker keeps the current signal and market context.</div><div class="card-text">Ask follow-up questions without explaining the background again.</div></div></div><div class="chat"><div class="shortcuts"><div class="shortcut">Why is this signal important?</div><div class="shortcut">What market is most related?</div><div class="shortcut">What could go wrong?</div><div class="shortcut">Compare related markets.</div></div><div class="bubble me">Summarize the risk.</div><div class="bubble">The main risk is that the headline may already be priced in. Check volume, odds movement, and related market confirmation.</div><div class="input"><span>Ask AI Broker anything...</span><span class="voice">Voice</span></div></div></div>`)}
function plans(){return `<div class="plans"><div class="plan"><div class="plan-top"><h3>Free</h3><span class="chip gray">Basic</span></div><div class="price">$0</div><p>Basic AI Broker access.</p><button class="plan-btn">Start Free</button></div><div class="plan pro"><div class="plan-top"><h3>Blue Pro</h3><span class="chip blue">3-day trial</span></div><div class="price">$19.99<small>/mo</small></div><p>Try free for 3 days. Stronger AI Broker, Portfolio Studio, fork / publish portfolios, and 1 scoped auto-copy.</p><button class="plan-btn">Try Pro Free</button></div><div class="plan max"><div class="plan-top"><h3>Gold Max</h3><span class="chip gold">3-day trial</span></div><div class="price">$99.99<small>/mo</small></div><p>Try free for 3 days. Best model, model picker, multi-agent research, multi-portfolio tools, and advanced risk control.</p><button class="plan-btn">Try Max Free</button></div></div>`}
function toggle(n){if(selected.has(n)){if(selected.size>1)selected.delete(n)}else selected.add(n);render()}
function render(){let p=pages[step];title.textContent=p.t;subtitle.textContent=p.s;indicator.textContent=`Page ${step+1} / ${pages.length}`;preview.innerHTML=p.r();dots.innerHTML=pages.map((_,i)=>`<span class="stepdot ${i===step?'active':''}"></span>`).join('');backBtn.disabled=step===0;nextBtn.textContent=step===pages.length-1?'Enter Questflow':'Continue'}
function next(){if(step<pages.length-1){step++;render()}else finish()}
function prev(){if(step>0){step--;render()}}
function finish(){document.querySelector('.hero').innerHTML='<div class="page-indicator">Demo Complete</div><h1>Enter Questflow</h1><p class="subtitle">Signals, trading, preferences, AI, and subscription — adapted from the App onboarding for Web.</p><button class="next" style="margin-top:28px" onclick="location.reload()">Replay Demo</button>';document.querySelector('.footer').style.display='none'}
render();
</script>
</body>
</html>
